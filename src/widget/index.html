<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accez Assistant</title>
  <link rel="stylesheet" href="/widget.css">
</head>
<body>
  <div id="app" class="app" data-greeting="__GREETING__">
    <section id="panel" class="panel" role="dialog" aria-label="Accez Assistant chat" hidden>
      <header class="head">
        <div class="avatar"><img src="/logo.png" alt="" width="46" height="46"></div>
        <div class="who">
          <div class="name"><strong>Accez Assistant</strong>
            <svg class="tick" viewBox="0 0 24 24" width="18" height="18" role="img" aria-label="Verified"><path d="M12 1.8l2.5 1.7 3-.2 1.2 2.8 2.6 1.5-.6 3 1.4 2.7-2 2.3-.2 3-2.9.9-1.9 2.4-2.9-1.1-2.9 1.1-1.9-2.4-2.9-.9-.2-3-2-2.3 1.4-2.7-.6-3 2.6-1.5 1.2-2.8 3 .2z" fill="#4cc2ff"/><path d="M8 12.4l2.7 2.7L16.2 9.6" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </div>
          <span><i class="dot"></i><b>Online</b></span>
        </div>
        <button id="close" class="icon-btn" type="button" aria-label="Close chat">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </header>
      <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div id="chips" class="chips"></div>
      <form id="composer" class="composer" autocomplete="off">
        <label for="input" class="sr">Type a message</label>
        <input id="input" type="text" maxlength="600" placeholder="Type a message..." enterkeyhint="send">
        <button class="send" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </form>
    </section>
    <button id="toggle" class="toggle" type="button" aria-label="Open chat" aria-expanded="false" aria-controls="panel">
      <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    </button>
  </div>
  <script src="/widget.js" defer></script>
</body>
</html>
